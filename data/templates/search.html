{% extends "partials/base.html" %}

{% block content %}
<section class="flex flex-col items-center justify-center min-h-[80vh] px-4">
  <!-- Header -->
  <div class="text-center mb-8">
    <h1 class="text-4xl md:text-5xl font-extrabold text-green-700 dark:text-green-400 mb-3">
      Search by Plant Name
    </h1>
    <p class="text-gray-700 dark:text-gray-300 max-w-xl mx-auto">
      Enter the name of a plant to identify it and learn about its species, care, and more.
    </p>
  </div>

  <!-- Search Form -->
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 w-full max-w-lg">
    <form action="{{ url_for('search') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
      <div>
        <label for="plant_name" class="block text-lg font-medium text-gray-800 dark:text-gray-200 mb-2">
          Plant Name
        </label>
        <input
          type="text"
          id="plant_name"
          name="plant_name"
          placeholder="e.g., Aloe Vera"
          required
          autocomplete="off"
          class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white p-3 focus:ring-2 focus:ring-green-500 focus:outline-none transition"
        />
      </div>

      <button
        type="submit"
        class="w-full py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 dark:bg-green-500 dark:hover:bg-green-600 font-semibold text-lg transition-all duration-200">
        Search Plant
      </button>
    </form>
  </div>

  <!-- Info Section -->
  <div class="mt-10 text-center text-gray-600 dark:text-gray-400 text-sm">
    <p>💡 Tip: Make sure the spelling of the plant name is correct for accurate results.</p>
  </div>
</section>

<!-- Simple fade-in animation -->
<style>
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  section {
    animation: fadeInUp 0.4s ease-out;
  }
</style>
{% endblock %}
