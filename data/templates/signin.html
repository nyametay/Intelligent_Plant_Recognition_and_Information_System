{% extends "partials/signbase.html" %}
{% block content %}
  <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 mx-4">
    <h1 class="text-3xl font-bold text-center text-green-700 dark:text-green-400 mb-2">Welcome Back</h1>
    <p class="text-center text-gray-600 dark:text-gray-300 mb-8">Please enter your details to sign in</p>

    <form action="{{ url_for('signin') }}" method="post" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
        <input type="text" name="username" id="username"
               placeholder="Enter your username"
               required autocomplete="off"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600
                      bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100
                      focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>

      <div class="relative">
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
        <input type="password" name="password" id="password"
               placeholder="Enter your password"
               required autocomplete="off"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600
                      bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100
                      focus:outline-none focus:ring-2 focus:ring-green-500">
        <i id="togglePassword"
           class="fas fa-eye absolute right-4 top-9 text-gray-400 hover:text-green-500 cursor-pointer"></i>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-700 dark:text-gray-300">
          <input type="checkbox" class="form-checkbox text-green-600 rounded"> Remember me
        </label>
        <a href="{{ url_for('forgot') }}"
           class="text-green-700 dark:text-green-400 hover:underline">Forgot Password?</a>
      </div>

      <button type="submit"
              class="w-full py-3 rounded-lg bg-green-600 text-white font-semibold
                     hover:bg-green-700 dark:bg-green-500 dark:hover:bg-green-600 transition">
        Sign In
      </button>

      <p class="text-center text-sm text-gray-700 dark:text-gray-300 mt-6">
        Don’t have an account?
        <a href="{{ url_for('signup') }}" class="text-green-700 dark:text-green-400 font-semibold hover:underline">
          Create one
        </a>
      </p>
    </form>
  </div>

{% endblock %}
