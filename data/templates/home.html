{% extends "partials/base.html" %}

{% block content %}
<section class="flex flex-col-reverse md:flex-row items-center justify-between gap-12">
  <!-- Text Content -->
  <div class="md:w-1/2 text-center md:text-left">
    <h1 class="text-4xl md:text-5xl font-extrabold text-green-700 dark:text-green-400 leading-tight mb-4">
      Enhance Your <br /> Green Journey
    </h1>
    <p class="text-lg mb-6 text-gray-700 dark:text-gray-300">
      Our Plant Identification System simplifies your botanical journey!
    </p>
    <button id="choose_path"
            class="inline-flex items-center gap-2 px-6 py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 dark:bg-green-500 dark:hover:bg-green-600 transition">
      Identify Plant <i class="ri-arrow-right-down-line text-xl"></i>
    </button>
  </div>

  <!-- Image -->
  <div class="md:w-1/2">
    <img src="{{ url_for('static', filename='images/img/home.png') }}" alt="Plant" class="rounded-2xl shadow-lg w-full" />
  </div>
</section>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-11/12 md:w-1/3 p-8 relative">
    <h2 class="text-2xl font-bold text-green-700 dark:text-green-400 mb-4">Form of Identification</h2>
    <p class="text-gray-700 dark:text-gray-300 mb-6">You can search for a plant by name or by image</p>
    <div class="flex flex-col gap-4">
      <a href="{{ url_for('search') }}"
         class="w-full block text-center py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 transition">
         🌿 Use Text
      </a>

      <a href="{{ url_for('scan') }}"
         class="w-full block text-center py-3 bg-green-500 text-white rounded-xl hover:bg-green-600 transition">
         📷 Use Image
      </a>
    </div>

    <button id="closeModal" class="absolute top-3 right-3 text-gray-500 hover:text-green-500 text-2xl">
      <i class="ri-close-line"></i>
    </button>
  </div>
</div>

<!-- Social Links -->
<div class="flex flex-col items-center mt-16">
  <span class="text-gray-700 dark:text-gray-300 mb-3 text-lg font-semibold">Follow Us</span>
  <div class="flex gap-6 text-2xl">
    <a href="https://www.facebook.com/" target="_blank" class="hover:text-green-600 dark:hover:text-green-400"><i class="ri-facebook-fill"></i></a>
    <a href="https://www.instagram.com/" target="_blank" class="hover:text-green-600 dark:hover:text-green-400"><i class="ri-instagram-line"></i></a>
    <a href="https://twitter.com/" target="_blank" class="hover:text-green-600 dark:hover:text-green-400"><i class="ri-twitter-fill"></i></a>
  </div>
</div>

<script>
  const modal = document.getElementById('modal');
  const openBtn = document.getElementById('choose_path');
  const closeBtn = document.getElementById('closeModal');

  openBtn.addEventListener('click', () => modal.classList.remove('hidden'));
  closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
</script>
{% endblock %}
