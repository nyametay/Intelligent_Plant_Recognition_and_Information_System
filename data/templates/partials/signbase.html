<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IPRIS | Sign In</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/img/favicon.png') }}" type="image/x-icon">

  <!-- Remix icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
      // On initial load, apply saved theme (if any)
      if (localStorage.theme === 'dark' ||
          (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
  </script>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            green: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="transition-colors duration-300">

  <div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-b from-green-50 via-white to-green-100 dark:from-gray-900 dark:via-gray-950 dark:to-black transition-colors duration-500 relative">

  <!-- Back Home Button: fixed so it never overlaps the form -->
  <a href="{{ url_for('welcome') }}"
     class="fixed top-4 left-4 inline-flex items-center gap-2 px-4 py-2 rounded-full
            bg-green-600 text-white text-sm font-medium shadow-md z-50
            hover:bg-green-700 dark:bg-green-500 dark:hover:bg-green-600 transition">
    <i class="ri-arrow-left-line text-lg"></i> Back Home
  </a>
    {% include 'partials/notification.html' %}

    {% block content %}{% endblock %}

  </div>
  <!-- Floating theme toggle -->
  <button id="theme-toggle"
    class="fixed bottom-6 right-6 bg-green-600 text-white p-3 rounded-full shadow-lg hover:bg-green-700 transition">
    <i class="ri-sun-line text-xl hidden dark:inline"></i>
    <i class="ri-moon-line text-xl dark:hidden"></i>
  </button>

  <script src="{{ url_for('static', filename='scripts/sign_theme.js') }}"></script>
  <script src="{{ url_for('static', filename='scripts/viewpassword.js') }}"></script>
</body>
</html>
