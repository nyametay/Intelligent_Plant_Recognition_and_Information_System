{% extends "partials/signbase.html" %}
{% block content %}
  <!-- Forgot Password Card -->
  <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 sm:p-10 mx-4 mt-20">
    <h1 class="text-3xl font-bold text-center text-green-700 dark:text-green-400 mb-2">Forgot Password</h1>
    <p class="text-center text-gray-600 dark:text-gray-300 mb-8">Please enter your details to reset your password</p>

    <form action="{{ url_for('forgot') }}" method="post" class="space-y-6">

      <!-- Username -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
        <input type="text" name="username" id="username"
               placeholder="Enter your username"
               required autocomplete="off"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600
                      bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100
                      focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>

      <!-- Full Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Full Name</label>
        <input type="text" name="name" id="name"
               placeholder="Enter your full name"
               required autocomplete="off"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600
                      bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100
                      focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
        <input type="email" name="email" id="email"
               placeholder="Enter your email"
               required autocomplete="off"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600
                      bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100
                      focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>

      <!-- New Password -->
      <div class="relative">
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
        <input type="password" name="password" id="password"
               placeholder="Enter your password"
               required autocomplete="off"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600
                      bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100
                      focus:outline-none focus:ring-2 focus:ring-green-500">
        <i id="togglePassword"
           class="fas fa-eye absolute right-4 top-9 text-gray-400 hover:text-green-500 cursor-pointer"></i>
      </div>

      <!-- Submit Button -->
      <button type="submit"
              class="w-full py-3 rounded-lg bg-green-600 text-white font-semibold
                     hover:bg-green-700 dark:bg-green-500 dark:hover:bg-green-600 transition">
        Update Password
      </button>

      <!-- Sign In Link -->
      <p class="text-center text-sm text-gray-700 dark:text-gray-300 mt-6">
        Already have an account?
        <a href="{{ url_for('signin') }}" class="text-green-700 dark:text-green-400 font-semibold hover:underline">
          Sign in
        </a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
